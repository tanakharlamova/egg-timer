<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <div id="heading">
        <h1>Soft or Hard Boiled Egg?</h1>
    </div>
    <div id="container"> 
        <div id="soft_boiled_egg_container">
        <h3 id="header">Soft Boiled Egg</h3> 
        <button id="myButton_left" class="start-button">Click to start!</button>
        <p id="countdown_left" class="countdown"></p> 
        <button id="reset_left" class="reset-button">Reset</button>
        <p id="ready_left"> </p> 
        </div> 

        <div id="hard_boiled_egg_container">
        <h3 id="header">Hard Boiled Egg</h3> 
        <button id="myButton_right" class="start-button">Click to start!</button>
        <p id="countdown_right" class="countdown"></p>  
        <button id="reset_right" class="reset-button">Reset</button> 
        <p id="ready_right"> </p> 
        </div> 
    </div>  

    <video id="myVideo" autoplay="autoplay" loop="loop" muted defaultMuted playsinline type="video/mp4">
        <source src="boiling eggs.mp4">
    </video>

    <script src="index.js"></script>
</body>
</html>
